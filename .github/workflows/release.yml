# Builds and publishes the Docker image when a GitHub release is published.
#   - tests must pass first
#   - image: ghcr.io/<owner>/finanzprognose:<tag>, plus :latest for non-prereleases
#   - deploy/install.sh is attached to the release as the entry point for new installations
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # upload the release asset
  packages: write   # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-rc1"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests (including the browser tests of the contract suite)
        run: |
          pip install -r requirements-contract.txt
          python -m playwright install --with-deps chromium
          python -m pytest -q -m ""

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$image:$TAG"
            [[ "$PRERELEASE" == "true" ]] || echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Attach install.sh to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" deploy/install.sh --clobber
