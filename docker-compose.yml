# Build-from-source variant, e.g. to try the production image locally.
# Real installations use deploy/docker-compose.yml (the released image), set up by deploy/install.sh.
services:
  finanzprognose:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: finanzprognose
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      TZ: Europe/Berlin
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Please set APP_PASSWORD in the .env file}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_REQUIRE_MARKER: "1"
      DB_PATH: /data/finanzen.sqlite
      BACKUP_DIR: /backup
    volumes:
      - ./data:/data                          # working database (local on the container host)
      - ${BACKUP_HOST_DIR:?Please set BACKUP_HOST_DIR in .env}:/backup   # NAS share
