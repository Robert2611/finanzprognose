# Production compose file. It ships inside the image (/deploy) and is copied to the install
# directory (default /opt/finanzprognose) by install.sh and update.sh. Do not edit it there:
# the next update overwrites it. All settings belong in .env next to it.
services:
  finanzprognose:
    image: ghcr.io/robert2611/finanzprognose:${APP_VERSION:?Please set APP_VERSION in the .env file}
    container_name: finanzprognose
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      TZ: Europe/Berlin
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Please set APP_PASSWORD in the .env file}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_REQUIRE_MARKER: "1"
      DB_PATH: /data/finanzen.sqlite
      BACKUP_DIR: /backup
      UPDATE_DIR: /updater                    # B-026: status of the host updater, "Jetzt aktualisieren"
    volumes:
      - ./data:/data                          # working database (local disk of the VM)
      - ./updater:/updater                    # files shared with auto-update.sh on the host
      - ${BACKUP_HOST_DIR:?Please set BACKUP_HOST_DIR in .env}:/backup   # NAS share
