[pytest]
testpaths = tests
# Browser (Playwright) tests are slow and need Chromium, so the default run skips them.
# Run everything (as the release pipeline does):  python -m pytest -m ""
addopts = -m "not browser"
markers =
    contract(*ids): clause ID(s) from contracts/TRACEABILITY.md that the test verifies
    browser: needs a real browser (Playwright); excluded from the default run
    app_settings(**overrides): per-test Settings overrides for the app/client/live_server fixtures
    browser_context(**options): extra Playwright browser-context options (e.g. http_credentials)
